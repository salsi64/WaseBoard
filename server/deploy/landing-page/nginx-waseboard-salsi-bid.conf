server {
    server_name waseboard.salsi.bid;
    include /etc/nginx/snippets/cloudflare-realip.conf;
    # Rejet des scanners + limitation de débit (deploy/nginx/ : waseboard-limits.conf dans conf.d, waseboard-hardening.conf dans snippets).
    include /etc/nginx/snippets/waseboard-hardening.conf;
    # HSTS pour les réponses du serveur WaseBoard (/app, API) ; les pages statiques ci-dessous ont tous leurs en-têtes via le snippet.
    add_header Strict-Transport-Security "max-age=15552000" always;

    root /var/www/waseboard-landing;
    index index.html;

    # Page d'accueil + pages statiques annexes (confidentialite, conditions -- requises pour la
    # verification Discord de l'application) servies directement par nginx ; tout le reste (l'API
    # elle-meme) part vers le serveur WaseBoard. Meme dossier que waseboard.duckdns.org.
    location = / {
        include /etc/nginx/snippets/waseboard-security-headers.conf;
        # Activité Discord : Discord charge la racine du domaine avec ?frame_id=… (URL mapping « / ») : on y sert l'application web.
        if ($arg_frame_id) { rewrite ^ /app/ last; }
        try_files /index.html =404;
    }
    # Version anglaise de la page d'accueil (lien « English » en bas de la page française).
    location = /en {
        include /etc/nginx/snippets/waseboard-security-headers.conf;
        try_files /index.en.html =404;
    }
    location = /privacy.html {
        include /etc/nginx/snippets/waseboard-security-headers.conf;
        try_files /privacy.html =404;
    }
    # Captures d'ecran de la page d'accueil (dossier img/, noms versionnes pour contourner le cache Cloudflare).
    location ^~ /img/ {
        include /etc/nginx/snippets/waseboard-security-headers.conf;
        try_files $uri =404;
        expires 7d;
    }
    # Icône du site (logo de WaseBoard, 16/32/48 px) : les navigateurs la demandent à la racine.
    location = /favicon.ico {
        include /etc/nginx/snippets/waseboard-security-headers.conf;
        try_files /favicon.ico =404;
        expires 7d;
    }
    location = /terms.html {
        include /etc/nginx/snippets/waseboard-security-headers.conf;
        try_files /terms.html =404;
    }
    # Guide « Micro en jeu » (fonction expérimentale du client), lié depuis l'accueil.
    location = /micro-en-jeu.html {
        include /etc/nginx/snippets/waseboard-security-headers.conf;
        try_files /micro-en-jeu.html =404;
    }

    location / {
        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64M;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/waseboard.salsi.bid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/waseboard.salsi.bid/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = waseboard.salsi.bid) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name waseboard.salsi.bid;
    return 404;
}
