# /etc/nginx/snippets/waseboard-security-headers.conf — en-têtes de sécurité des pages STATIQUES servies par nginx (accueil, confidentialité,
# conditions, guide micro, images). À inclure à l'INTÉRIEUR de chaque « location » qui sert un fichier du dossier du site :
#
#     location = /privacy.html {
#         include /etc/nginx/snippets/waseboard-security-headers.conf;
#         try_files /privacy.html =404;
#     }
#
# NE PAS l'inclure au niveau « server », ni dans la « location / » qui renvoie vers WaseBoard : l'application web (/app) et l'Activité Discord posent
# leurs propres en-têtes (notamment « frame-ancestors », qui autorise Discord à l'afficher dans un cadre), alors qu'ici on interdit tout cadrage.
# Au niveau « server », on ajoute seulement le HSTS (voir nginx-waseboard-salsi-bid.conf) : il couvre les réponses du serveur WaseBoard.
#
# nginx n'hérite des « add_header » d'un niveau supérieur que si le niveau courant n'en définit aucun : le HSTS est donc répété ici.
# Les pages n'ont ni script ni ressource externe (seulement des liens et des images du site) : la politique de contenu est fermée.
add_header Strict-Transport-Security "max-age=15552000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
