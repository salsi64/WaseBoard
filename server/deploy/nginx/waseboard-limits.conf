# /etc/nginx/conf.d/waseboard-limits.conf — contexte « http » : définit la zone de limitation de débit utilisée par
# waseboard-hardening.conf. Ne change rien tant qu'un serveur ne l'utilise pas.
#
# 30 requêtes par seconde et par adresse IP : bien au-dessus de l'usage normal (le client sonde /activity toutes les 300 ms,
# soit ~3 requêtes par seconde, et une page web charge ses ~20 fichiers d'un coup, absorbés par « burst »), mais ça arrête
# net une rafale (boucle, scanner, déni de service maladroit) avant qu'elle atteigne le serveur WaseBoard.
limit_req_zone $binary_remote_addr zone=waseboard_ip:10m rate=30r/s;
# Refus « Too Many Requests » (429) plutôt que 503 : le client WaseBoard et la page web savent l'interpréter.
limit_req_status 429;
