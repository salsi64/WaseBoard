# /etc/nginx/snippets/waseboard-hardening.conf — à inclure dans le bloc « server { } » d'un site WaseBoard :
#     include /etc/nginx/snippets/waseboard-hardening.conf;
# (avant les autres « location »). Prérequis : waseboard-limits.conf dans /etc/nginx/conf.d/.
#
# 1. Rejet net (444 : nginx ferme la connexion sans répondre) des chemins que seuls les scanners de vulnérabilités demandent :
#    fichiers cachés (.env, .git…), WordPress, phpMyAdmin, interfaces d'administration d'autres logiciels. Rien de tout ça n'existe
#    sur WaseBoard : ces requêtes n'arrivent jamais jusqu'au serveur, et ne remplissent plus son journal.
#    « /.well-known/ » reste ouvert (validation des certificats).
location ~* ^/(?:\.(?!well-known/)|wp-|xmlrpc\.php|phpmyadmin|pma/|myadmin|cgi-bin|boaform|actuator|vendor/phpunit|HNAP1|owa/|ecp/|solr/|manager/html|admin\.php|setup\.php|config\.php|shell\.php|eval-stdin\.php) {
    access_log off;
    return 444;
}

# 2. Limitation de débit par adresse IP : jusqu'à 60 requêtes d'un coup, puis 30 par seconde (voir waseboard-limits.conf).
limit_req zone=waseboard_ip burst=60 nodelay;
