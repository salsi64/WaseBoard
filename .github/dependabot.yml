# Mises à jour de dépendances : une demande groupée par écosystème et par semaine (pas une PR par paquet).
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/src/WaseBoard"
    schedule:
      interval: "weekly"
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/server"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/server"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
